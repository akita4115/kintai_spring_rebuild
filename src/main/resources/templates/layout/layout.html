<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title layout:title-pattern="$CONTENT_TITLE - 勤怠管理システム">
		勤怠管理システム
	</title>

	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- 各画面固有のCSSを差し込む場所 -->
	<th:block layout:fragment="css"></th:block>
</head>

<body>

	<!-- 共通メニューバー -->
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">

		<div class="container-fluid">

			<!-- システム名 -->
			<a class="navbar-brand" th:href="@{/}">
				勤怠管理システム
			</a>

			<!-- スマートフォン表示用 -->
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu"
				aria-controls="navbarMenu" aria-expanded="false" aria-label="メニューを開く">

				<span class="navbar-toggler-icon"></span>

			</button>


			<div class="collapse navbar-collapse" id="navbarMenu">

				<ul class="navbar-nav me-auto">


					<!-- ================================= -->
					<!-- 管理ユーザのみ表示 -->
					<!-- ================================= -->
					<th:block sec:authorize="hasRole('ADMIN')">

						<!-- 勤怠管理 -->
						<li class="nav-item">

							<a class="nav-link"
								th:classappend="${activePage == 'kintaiManage'} ? ' active fw-bold' : ''"
								th:href="@{/kintai/manage}">
								勤怠管理
							</a>

						</li>

					</th:block>


					<!-- ================================= -->
					<!-- 勤怠入力 -->
					<!-- 一般・管理ユーザ共通 -->
					<!-- ================================= -->
					<li class="nav-item">

						<a class="nav-link" th:classappend="${activePage == 'kintaiInput'} ? ' active fw-bold' : ''"
							th:href="@{/}">
							勤怠入力
						</a>

					</li>


					<!-- ================================= -->
					<!-- マスタ管理 -->
					<!-- 管理ユーザのみ表示 -->
					<!-- ================================= -->
					<th:block sec:authorize="hasRole('ADMIN')">

						<li class="nav-item dropdown">

							<a class="nav-link dropdown-toggle"
								th:classappend="${activePage == 'user' or activePage == 'holiday'} ? ' active fw-bold' : ''"
								href="#" id="masterMenu" role="button" data-bs-toggle="dropdown" aria-expanded="false">

								マスタ管理

							</a>


							<ul class="dropdown-menu dropdown-menu-dark bg-dark" aria-labelledby="masterMenu">

								<!-- 社員マスタ管理 -->
								<li>
									<a class="dropdown-item" th:href="@{/user/index}">
										社員マスタ管理
									</a>
								</li>



								<!-- 祝日マスタ管理 -->
								<li>
									<a class="dropdown-item" th:href="@{/holiday/index}">
										祝日マスタ管理
									</a>
								</li>

							</ul>

						</li>

					</th:block>


					<!-- ================================= -->
					<!-- ログアウト -->
					<!-- 一般・管理ユーザ共通 -->
					<!-- ================================= -->
					<li class="nav-item">

						<form th:action="@{/logout}" method="post" class="m-0">

							<button type="submit" class="nav-link border-0 bg-transparent">
								ログアウト
							</button>

						</form>

					</li>

				</ul>

			</div>

		</div>

	</nav>


	<!-- 各画面固有のコンテンツ -->
	<div layout:fragment="content"></div>


	<!-- Bootstrap JavaScript -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
	</script>


	<!-- 各画面固有のJavaScript -->
	<th:block layout:fragment="script"></th:block>

</body>

</html>
