<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title layout:title-pattern="$CONTENT_TITLE - 勤怠管理システム">
		勤怠管理システム
	</title>

	<!-- Bootstrap CSS -->
	<link
		href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		rel="stylesheet">

	<!-- 各画面固有のCSSを差し込む場所 -->
	<th:block layout:fragment="css"></th:block>
</head>

<body>

	<!-- 共通メニューバー -->
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
		<div class="container-fluid">

			<a class="navbar-brand" th:href="@{/}">
				勤怠管理システム
			</a>

			<button
				class="navbar-toggler"
				type="button"
				data-bs-toggle="collapse"
				data-bs-target="#navbarMenu">
				<span class="navbar-toggler-icon"></span>
			</button>

			<div class="collapse navbar-collapse" id="navbarMenu">
				<ul class="navbar-nav me-auto">

					<!-- 勤怠入力：一般・管理どちらもアクセス可 -->
					<li class="nav-item">
						<a class="nav-link" th:href="@{/}">
							勤怠入力
						</a>
					</li>

					<!-- 以下、管理ユーザのみ表示 -->
					<th:block sec:authorize="hasRole('ADMIN')">

						<li class="nav-item">
							<a class="nav-link" th:href="@{/kintai/manage}">
								勤怠管理
							</a>
						</li>

						<li class="nav-item dropdown">
							<a
								class="nav-link dropdown-toggle"
								href="#"
								id="masterMenu"
								role="button"
								data-bs-toggle="dropdown">
								マスタ管理
							</a>
							<ul class="dropdown-menu" aria-labelledby="masterMenu">
								<li>
									<a class="dropdown-item" th:href="@{/user/index}">
										社員マスタ
									</a>
								</li>
								<li>
									<a class="dropdown-item" th:href="@{/holiday/index}">
										祝日マスタ
									</a>
								</li>
							</ul>
						</li>

					</th:block>

				</ul>

				<!-- ログインユーザ名表示 -->
				<span
					class="navbar-text text-white me-3"
					sec:authentication="name">
				</span>

				<!-- ログアウト（CSRFトークン付きのPOSTフォーム） -->
				<form th:action="@{/logout}" method="post" class="d-flex">
					<button type="submit" class="btn btn-outline-light btn-sm">
						ログアウト
					</button>
				</form>

			</div>
		</div>
	</nav>

	<!-- 各画面固有のコンテンツを差し込む場所 -->
	<div layout:fragment="content"></div>

	<!-- Bootstrap JavaScript -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
	</script>

	<!-- 各画面固有のJSを差し込む場所 -->
	<th:block layout:fragment="script"></th:block>

</body>

</html>
