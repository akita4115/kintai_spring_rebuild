<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<title>祝日マスタ管理</title>
</head>

<body>

	<div layout:fragment="content">

		<div class="container">

			<h2 class="mb-4">祝日マスタ管理</h2>



			<!-- 検索条件 -->

			<div class="card mb-4">

				<div class="card-header bg-light py-3 px-4">
					検索条件
				</div>

				<div class="card-body px-4">

					<form th:action="@{/holiday/index}" th:object="${holidaySearchForm}" method="get">

						<div class="row mb-3">

							<div class="col-md-4">

								<label class="form-label">
									日付:
								</label>

								<input type="date" class="form-control" th:field="*{yyyymmdd}">

							</div>

							<div class="col-md-4">

								<label class="form-label">
									祝日名:
								</label>

								<input type="text" class="form-control" th:field="*{holidayName}">

							</div>

						</div>


						<!-- 検索ボタン -->
						<div class="d-flex justify-content-end">

						<button type="button" class="btn btn-warning me-2" id="clearSearchButton">
							クリア
						</button>

							<button type="submit" class="btn btn-info">
								検索
							</button>

						</div>

					</form>

				</div>

			</div>



			<!-- 検索結果 -->

			<div class="card mb-4">

				<div class="card-header bg-light py-3 px-4">
					検索結果
				</div>

				<div class="card-body">

					<!-- 操作ボタン -->
					<div class="d-flex justify-content-end mb-3">

						<button type="button" class="btn btn-success me-2" data-bs-toggle="modal"
							data-bs-target="#createModal">
							新規
						</button>

						<button type="button" class="btn btn-primary me-2" id="updateButton" disabled>
							更新
						</button>

						<button type="button" class="btn btn-danger" id="deleteButton" disabled>
							削除
						</button>

					</div>


					<!-- 一覧 -->
					<table class="table table-hover">

						<thead class="table-dark">

							<tr>
								<th>#</th>
								<th>日付</th>
								<th>祝日名</th>
							</tr>

						</thead>

						<tbody>

							<tr th:each="holiday : ${holidayList}">

								<td>

									<input type="radio" name="selectedHoliday" th:value="${holiday.id}"
										th:data-yyyymmdd="${holiday.yyyymmdd}"
										th:data-holiday-name="${holiday.holidayName}">

								</td>

								<td th:text="${#temporals.format(holiday.yyyymmdd, 'yyyy/MM/dd')}">
								</td>

								<td th:text="${holiday.holidayName}">
								</td>

							</tr>

						</tbody>

					</table>
					
					<!-- 検索結果なし -->
					<div th:if="${#lists.isEmpty(holidayList)}" class="alert alert-warning">
						検索結果がありませんでした。
					</div>

					<!-- ページング -->


					<nav th:if="${totalPages > 0}">

						<ul class="pagination justify-content-center">

							<!-- 前へ -->
							<li class="page-item" th:classappend="${holidaySearchForm.page <= 1} ? ' disabled' : ''">

								<a class="page-link" th:href="@{/holiday/index(
									page=${holidaySearchForm.page - 1},
									yyyymmdd=${holidaySearchForm.yyyymmdd},
									holidayName=${holidaySearchForm.holidayName}
								)}">
									前
								</a>

							</li>


							<!-- ページ番号 -->
							<li class="page-item" th:each="pageNo : ${#numbers.sequence(1, totalPages)}"
								th:classappend="${pageNo == holidaySearchForm.page} ? ' active' : ''">

								<a class="page-link" th:href="@{/holiday/index(
									page=${pageNo},
									yyyymmdd=${holidaySearchForm.yyyymmdd},
									holidayName=${holidaySearchForm.holidayName}
								)}" th:text="${pageNo}">
								</a>

							</li>


							<!-- 次へ -->
							<li class="page-item"
								th:classappend="${holidaySearchForm.page >= totalPages} ? ' disabled' : ''">

								<a class="page-link" th:href="@{/holiday/index(
									page=${holidaySearchForm.page + 1},
									yyyymmdd=${holidaySearchForm.yyyymmdd},
									holidayName=${holidaySearchForm.holidayName}
								)}">
									次
								</a>

							</li>

						</ul>

					</nav>


				</div>

			</div>




			<!-- 新規登録モーダル -->

			<div class="modal fade" id="createModal" tabindex="-1" aria-hidden="true">

				<div class="modal-dialog modal-lg">

					<div class="modal-content">

						<form th:action="@{/holiday/create}" th:object="${holidayDetailForm}" method="post"
							id="createHolidayForm">

							<!-- 登録後の再検索用 -->
							<input type="hidden" name="searchYyyymmdd" th:value="${holidaySearchForm.yyyymmdd}">

							<input type="hidden" name="searchHolidayName" th:value="${holidaySearchForm.holidayName}">


							<!-- ヘッダー -->
							<div class="modal-header bg-info text-white">

								<h5 class="modal-title fw-bold">
									祝日登録
								</h5>

								<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる">
								</button>

							</div>


							<!-- モーダル本文 -->
							<div class="modal-body p-4">

								<div class="card">

									<div class="card-header bg-light py-3">
										祝日情報
									</div>

									<div class="card-body py-4">

										<div class="row">

											<!-- 日付 -->
											<div class="col-md-4">

												<label for="createYyyymmdd" class="form-label">
													日付:
												</label>

												<input type="date" id="createYyyymmdd" class="form-control"
													th:classappend="${#fields.hasErrors('yyyymmdd')} ? 'is-invalid'"
													th:field="*{yyyymmdd}">

												<div class="invalid-feedback" th:text="${#fields.hasErrors('yyyymmdd')
													? #fields.errors('yyyymmdd')[0]
													: '必須入力です。'}">
												</div>

											</div>

											<!-- 祝日名 -->
											<div class="col-md-4">

												<label for="createHolidayName" class="form-label">
													祝日名:
												</label>

												<input type="text" id="createHolidayName" class="form-control"
													th:classappend="${#fields.hasErrors('holidayName')} ? 'is-invalid'"
													th:field="*{holidayName}">

												<div class="invalid-feedback" th:text="${#fields.hasErrors('holidayName')
													? #fields.errors('holidayName')[0]
													: '必須入力です。'}">
												</div>

											</div>

										</div>
									</div>

								</div>

							</div>

							<!-- フッター -->
							<div class="modal-footer py-3">

								<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
									キャンセル
								</button>

								<button type="button" class="btn btn-success" id="createHolidayButton">
									登録
								</button>

							</div>

						</form>

					</div>

				</div>

			</div>

			<!-- 削除モーダル -->
			<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">

				<div class="modal-dialog">

					<div class="modal-content">

						<form th:action="@{/holiday/delete}" method="post" id="deleteHolidayForm">

							<input type="hidden" id="deleteId" name="id">

							<input type="hidden" name="searchYyyymmdd" th:value="${holidaySearchForm.yyyymmdd}">

							<input type="hidden" name="searchHolidayName" th:value="${holidaySearchForm.holidayName}">

							<div class="modal-header bg-info text-white">

								<h5 class="modal-title fw-bold">
									祝日削除
								</h5>

								<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる">
								</button>

							</div>

							<div class="modal-body py-4">

								<p class="mb-0">
									選択した祝日を削除しますか？
								</p>

							</div>

							<div class="modal-footer py-3">

								<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
									キャンセル
								</button>

								<button type="submit" class="btn btn-danger">
									削除
								</button>

							</div>

						</form>

					</div>

				</div>

			</div>

			<!-- 更新モーダル -->
			<div class="modal fade" id="updateModal" tabindex="-1" aria-hidden="true">

				<div class="modal-dialog modal-lg">

					<div class="modal-content">

						<form th:action="@{/holiday/update}" th:object="${holidayUpdateForm}" method="post"
							id="updateHolidayForm">

							<!-- 更新後の再検索用 -->
							<input type="hidden" name="searchYyyymmdd" th:value="${holidaySearchForm.yyyymmdd}">

							<input type="hidden" name="searchHolidayName" th:value="${holidaySearchForm.holidayName}">

							<!-- 更新対象ID -->
							<input type="hidden" id="updateId" th:field="*{id}">

							<!-- ヘッダー -->
							<div class="modal-header bg-info text-white">

								<h5 class="modal-title fw-bold">
									祝日更新
								</h5>

								<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる">
								</button>

							</div>

							<!-- モーダル本文 -->
							<div class="modal-body p-4">

								<div class="card">

									<div class="card-header bg-light py-3">
										祝日情報
									</div>

									<div class="card-body py-4">

										<div class="row">

											<!-- 日付 -->
											<div class="col-md-4">

												<label for="updateYyyymmdd" class="form-label">
													日付:
												</label>

												<input type="date" id="updateYyyymmdd" class="form-control"
													th:classappend="${#fields.hasErrors('yyyymmdd')} ? 'is-invalid'"
													th:field="*{yyyymmdd}">

												<div class="invalid-feedback" th:text="${#fields.hasErrors('yyyymmdd')
													? #fields.errors('yyyymmdd')[0]
													: '必須入力です。'}">
												</div>

											</div>

											<!-- 祝日名 -->
											<div class="col-md-4">

												<label for="updateHolidayName" class="form-label">
													祝日名:
												</label>

												<input type="text" id="updateHolidayName" class="form-control"
													th:classappend="${#fields.hasErrors('holidayName')} ? 'is-invalid'"
													th:field="*{holidayName}">

												<div class="invalid-feedback" th:text="${#fields.hasErrors('holidayName')
													? #fields.errors('holidayName')[0]
													: '必須入力です。'}">
												</div>
											</div>

										</div>

									</div>

								</div>

							</div>

							<!-- フッター -->
							<div class="modal-footer py-3">

								<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
									キャンセル
								</button>

								<button type="button" class="btn btn-primary" id="updateHolidayButton">
									更新
								</button>

							</div>

						</form>

					</div>

				</div>

			</div>
		</div>
	</div>

	<!-- 画面固有JavaScript -->

	<th:block layout:fragment="script">

		<script th:src="@{/js/holiday.js}"></script>

		<script th:if="${openUpdateModal}">
			document.addEventListener("DOMContentLoaded", function () {

				const updateModalElement =
					document.getElementById("updateModal");

				const updateModal =
					bootstrap.Modal.getOrCreateInstance(
						updateModalElement
					);

				updateModal.show();
			});
		</script>

		<script th:if="${openCreateModal}">
			document.addEventListener("DOMContentLoaded", function () {

				const createModalElement =
					document.getElementById("createModal");

				const createModal =
					bootstrap.Modal.getOrCreateInstance(
						createModalElement
					);

				createModal.show();
			});
		</script>

	</th:block>
</body>

</html>
