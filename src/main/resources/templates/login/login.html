<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>ログイン</title>

	<!-- Bootstrap CSS -->
	<link
		href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		rel="stylesheet">
</head>

<body>

	<div class="container">
		<div class="row justify-content-center mt-5">
			<div class="col-md-5 col-lg-4">

				<div class="card">

					<!-- 見出し -->
					<div class="card-header bg-light py-3">
						<h5 class="mb-0 fw-normal">ログイン</h5>
					</div>

					<!-- 入力部分 -->
					<div class="card-body p-3">

						<form th:method="post" th:action="@{/login}">

							<!-- メールアドレス -->
							<div class="mb-4">

								<label
									for="username"
									class="form-label">
									メールアドレス:
								</label>

								<input
									type="email"
									id="username"
									name="username"
									class="form-control"
									th:classappend="${param.error} ? ' is-invalid' : ''"
									autofocus>

								<!-- 認証失敗時 -->
								<div
									th:if="${param.error}"
									class="invalid-feedback">
									メールアドレスまたはパスワードが間違っています。
								</div>

							</div>

							<!-- パスワード -->
							<div class="mb-4">

								<label
									for="password"
									class="form-label">
									Password:
								</label>

								<input
									type="password"
									id="password"
									name="password"
									class="form-control">

							</div>

							<!-- ログインボタン -->
							<div class="text-end">

								<button
									type="submit"
									class="btn btn-success px-3">
									ログイン
								</button>

							</div>

						</form>

					</div>
				</div>

			</div>
		</div>
	</div>

	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
	</script>

</body>

</html>
